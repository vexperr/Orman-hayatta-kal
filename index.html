

<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Ormanda Hayatta Kal</title>

<style>

*{box-sizing:border-box}

body{margin:0;overflow:hidden;background:#14251b;font-family:Arial;color:white;touch-action:none}

canvas{display:block}

#hud{position:fixed;top:12px;left:12px;z-index:2;background:#0008;padding:12px;border-radius:12px;line-height:1.8}

#hint{position:fixed;top:12px;right:12px;background:#0008;padding:10px;border-radius:10px;font-size:12px}

#joystick{position:fixed;bottom:28px;left:28px;width:120px;height:120px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff66;z-index:3;touch-action:none}

#stick{position:absolute;left:35px;top:35px;width:46px;height:46px;border-radius:50%;background:#ffffffb8}

#message{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0009;padding:9px 14px;border-radius:10px;white-space:nowrap;font-size:13px}

</style>

</head>

<body>

<div id="hud">🌲 ORMANDA HAYATTA KAL<br>❤️ Can: 100<br>🍖 Açlık: 100<br>💧 Susuzluk: 100</div>

<div id="hint">İLK SÜRÜM<br>3D keşif</div>

<div id="joystick"><div id="stick"></div></div>

<div id="message">Joystick ile ormanda hareket et</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9bb9c1);

scene.fog = new THREE.Fog(0x9bb9c1, 25, 100);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 200);

const renderer = new THREE.WebGLRenderer({antialias:true});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd8edff,0x304326,2));

const sun = new THREE.DirectionalLight(0xffe5b3,2.2);

sun.position.set(12,22,8);

sun.castShadow=true;

scene.add(sun);

const ground = new THREE.Mesh(

 new THREE.PlaneGeometry(220,220),

 new THREE.MeshStandardMaterial({color:0x42613b,roughness:1})

);

ground.rotation.x=-Math.PI/2;

ground.position.y=-0.08;

ground.receiveShadow=true;

scene.add(ground);

const mat = (color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});

const trunkMat=mat(0x62452c),leafMats=[mat(0x244b2e),mat(0x315d35),mat(0x3e6939)];

const obstacles=[];

let seed=1837;

let moveX=0,moveY=0,moving=false;
let cameraAngle = 0;
let cameraPitch = 0.35;
let draggingCamera = false;
let lastTouchX = 0;
let lastTouchY = 0;

renderer.domElement.style.touchAction = 'none';

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  draggingCamera = true;
  lastTouchX = e.clientX;
  lastTouchY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', e => {
  if (!draggingCamera) return;

  const dx = e.clientX - lastTouchX;
  const dy = e.clientY - lastTouchY;

  cameraAngle -= dx * 0.006;
  cameraPitch = Math.max(-0.15, Math.min(0.8, cameraPitch + dy * 0.003));

  lastTouchX = e.clientX;
  lastTouchY = e.clientY;
});

function stopCameraDrag() {
  draggingCamera = false;
}

renderer.domElement.addEventListener('pointerup', stopCameraDrag);
renderer.domElement.addEventListener('pointercancel', stopCameraDrag);

function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}

function makeTree(x,z,scale=1){

 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*scale,.34*scale,2.5*scale,7),trunkMat);

 trunk.position.set(x,1.25*scale,z);

 trunk.castShadow=true;scene.add(trunk);

 for(let i=0;i<3;i++){

  const crown=new THREE.Mesh(

   new THREE.ConeGeometry((1.5-i*.22)*scale,2.3*scale,7),

   leafMats[Math.floor(rand()*leafMats.length)]

  );

  crown.position.set(x,(2.5+i*.85)*scale,z);

  crown.castShadow=true;scene.add(crown);

 }

 obstacles.push({x,z,r:.7*scale});

}

for(let i=0;i<190;i++){

 const x=(rand()-.5)*100,z=(rand()-.5)*100;

 if(Math.hypot(x,z)<7)continue;

 makeTree(x,z,.75+rand()*.65);

}

for(let i=0;i<65;i++){

 const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.25+rand()*.55,0),mat(0x777d76));

 rock.position.set((rand()-.5)*90,.2,(rand()-.5)*90);

 rock.scale.y=.6;rock.castShadow=true;scene.add(rock);

}

const player=new THREE.Group();

const skin=mat(0xd9a477),shirt=mat(0x344b78),pants=mat(0x343a3c),boots=mat(0x33271d);

function capsule(radius,length,material,x,y,z){

 const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(radius,length,4,8),material);

 mesh.position.set(x,y,z);mesh.castShadow=true;player.add(mesh);return mesh;

}

capsule(.34,.65,shirt,0,1.35,0);

const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,10),skin);

head.position.y=2;head.castShadow=true;player.add(head);

const legs=[];

for(const x of [-.17,.17]){

 const leg=capsule(.13,.48,pants,x,.66,0);legs.push(leg);

 const foot=new THREE.Mesh(new THREE.BoxGeometry(.22,.13,.36),boots);

 foot.position.set(x,.25,.08);player.add(foot);

}

for(const x of [-.43,.43]){

 const arm=capsule(.12,.42,skin,x,1.36,0);

 arm.rotation.z=x<0?-.15:.15;

}

player.position.set(0,0,0);scene.add(player);

let moveX=0,moveY=0,moving=false;

const joy=document.getElementById('joystick'),stick=document.getElementById('stick');

let activePointer=null;

function updateJoy(e){

 const r=joy.getBoundingClientRect();

 let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);

 const d=Math.hypot(x,y),max=38;

 if(d>max){x=x/d*max;y=y/d*max}

 moveX=x/max;moveY=y/max;

 stick.style.left=(35+x)+'px';stick.style.top=(35+y)+'px';

}

joy.addEventListener('pointerdown',e=>{activePointer=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoy(e)});

joy.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)updateJoy(e)});

function resetJoy(){activePointer=null;moveX=moveY=0;stick.style.left='35px';stick.style.top='35px'}

joy.addEventListener('pointerup',resetJoy);

joy.addEventListener('pointercancel',resetJoy);

const clock=new THREE.Clock();

let walkTime=0;

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(Math.abs(moveX)+Math.abs(moveY)>.08){

  
const dx = (moveX * Math.cos(cameraAngle) +
            moveY * Math.sin(cameraAngle)) * 5 * dt;

const dz = (-moveX * Math.sin(cameraAngle) -
            moveY * Math.cos(cameraAngle)) * 5 * dt;

const nx = player.position.x + dx;
const nz = player.position.z + dz;

let blocked = false;

for (const o of obstacles) {
  if (Math.hypot(nx - o.x, nz - o.z) < o.r + 0.45) {
    blocked = true;
    break;
  }
}

if (!blocked) {
  player.position.x = nx;
  player.position.z = nz;
}

if (Math.abs(dx) + Math.abs(dz) > 0.001) {
  player.rotation.y = Math.atan2(dx, dz);
}

  walkTime+=dt*10;

  legs[0].rotation.x=Math.sin(walkTime)*.65;

  legs[1].rotation.x=-Math.sin(walkTime)*.65;

 }else{

  legs.forEach(l=>l.rotation.x*=.8);

 }

 const target = new THREE.Vector3(
  player.position.x,
  1.2,
  player.position.z
);

const distance = 7;
const horizontal = distance * Math.cos(cameraPitch);

const desired = new THREE.Vector3(
  player.position.x + Math.sin(cameraAngle) * horizontal,
  player.position.y + 2.2 + distance * Math.sin(cameraPitch),
  player.position.z + Math.cos(cameraAngle) * horizontal
);

camera.position.lerp(desired, 0.12);
camera.lookAt(target);

 renderer.render(scene,camera);

}

animate();

addEventListener('resize',()=>{

 camera.aspect=innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>

</body>

</html>
